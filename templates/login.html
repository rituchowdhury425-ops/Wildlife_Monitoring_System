
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Wildlife Watch</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #edf1e9;
            font-family: Arial, sans-serif;
            color: #142b22;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 38px;
            background: #f8f8f2;
            border: 1px solid #d9dfd5;
            border-radius: 15px;
            box-shadow: 0 12px 35px rgba(20,43,34,.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-mark {
            width: 55px;
            height: 55px;
            margin: 0 auto 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #315d46;
            color: white;
            font-family: Georgia, serif;
            font-size: 30px;
        }

        h1 {
            margin: 0 0 9px;
            font-family: Georgia, serif;
            font-size: 30px;
        }

        .subtitle {
            color: #718071;
            font-size: 13px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5c9;
            border-radius: 7px;
            background: white;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #789b7e;
            border-color: #315d46;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #315d46;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #244735; }

        .message {
            padding: 11px;
            margin-bottom: 12px;
            border-radius: 7px;
            background: #e5eee4;
            color: #315d46;
            font-size: 13px;
        }

        .register-link {
            margin-top: 22px;
            text-align: center;
            color: #718071;
            font-size: 13px;
        }

        a {
            color: #315d46;
            font-weight: bold;
            text-decoration: none;
        }

        .footer {
            margin-top: 27px;
            text-align: center;
            color: #879184;
            font-size: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="auth-card">

    <div class="brand">
        <div class="brand-mark">W</div>
        <h1>Welcome Back</h1>
        <div class="subtitle">
            Sign in to your Wildlife Watch account.
        </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">

        <label>Email Address</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button type="submit">LOGIN</button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}">Register here</a>
    </div>

    <div class="footer">
        WILDLIFE WATCH · RESEARCH & MONITORING
    </div>

</div>

</body>
</html>
