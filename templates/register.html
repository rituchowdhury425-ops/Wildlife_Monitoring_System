
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Wildlife Watch</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #102d22, #285c3b);
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 35px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #204b32;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            margin-bottom: 17px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #34734b;
            box-shadow: 0 0 4px rgba(52,115,75,0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #285c3b;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #19452b;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .bottom-text a {
            color: #285c3b;
            font-weight: bold;
            text-decoration: none;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 13px;
        }

        .success {
            background: #e1f4e6;
            color: #205b32;
        }

        .danger {
            background: #ffe5e5;
            color: #a12626;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">🌿</div>

        <h1>Join Wildlife Watch</h1>

        <p class="subtitle">
            Create your account and explore wildlife monitoring.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                maxlength="100"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                maxlength="254"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                required
            >

            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Re-enter your password"
                minlength="8"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Login here</a>
        </p>

    </div>

</body>
</html>
